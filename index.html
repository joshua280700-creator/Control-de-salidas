<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supervisor - Control de Salidas</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 15px; background: #eef2f7; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 15px; }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; }
        .inputs-file { display: flex; flex-direction: column; gap: 10px; }
        .btn-scan { background: #007bff; color: white; border: none; padding: 10px; border-radius: 5px; width: 100%; font-size: 16px; }
        table { width: 100%; border-collapse: collapse; background: white; font-size: 12px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background: #343a40; color: white; }
        .status-sync { color: orange; font-weight: bold; }
        .status-ok { color: green; }
    </style>
</head>
<body>

<div class="card">
    <h3>1. Cargar Catálogo (Excels)</h3>
    <div class="inputs-file">
        <label>Viajes (1).xlsx: <input type="file" id="fileViajes" accept=".xlsx"></label>
        <label>Muelle.xlsx: <input type="file" id="fileMuelle" accept=".xlsx"></label>
    </div>
</div>

<div class="card">
    <div id="reader"></div>
    <div id="scannedInfo" style="margin-top:10px; font-weight:bold; color:#007bff; text-align:center;"></div>
</div>

<div class="card">
    <h3>Historial de Escaneo</h3>
    <table id="logTable">
        <thead>
            <tr>
                <th>Guía</th>
                <th>Muelle</th>
                <th>Orden</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
    let CATALOGO = {};
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw8drrVJiEM5PyMQ7_Ok3F2o1i1DjT44WgpP5yKvPQddkQRVI7yx3o2WAxX5AM3TWul/exec";

    // --- PROCESAMIENTO DE ARCHIVOS ---
    async function procesarArchivos() {
        const fileV = document.getElementById('fileViajes').files[0];
        const fileM = document.getElementById('fileMuelle').files[0];
        if(!fileV || !fileM) return;

        const dataV = await fileV.arrayBuffer();
        const dataM = await fileM.arrayBuffer();

        const wbV = XLSX.read(dataV);
        const wbM = XLSX.read(dataM);

        const paradas = XLSX.utils.sheet_to_json(wbV.Sheets["Paradas"]);
        const muelles = XLSX.utils.sheet_to_json(wbM.Sheets[wbM.SheetNames[0]]);

        // Unimos los datos
        paradas.forEach(p => {
            const idViaje = p["IdViaje"];
            const guia = p["Pedido Referencia externa"];
            
            // Buscamos el muelle que coincida con el ID del viaje
            const infoMuelle = muelles.find(m => m["ID"].toString().startsWith(idViaje.toString()));

            if(infoMuelle) {
                let muelleFinal = infoMuelle["Muelle de salida"];
                const idCompleto = infoMuelle["ID"].toString();
                
                // Lógica de Oleadas (guion)
                if(idCompleto.includes("-")) {
                    const oleada = idCompleto.split("-")[1].trim();
                    if(oleada !== "1") {
                        muelleFinal += oleada; // Ej: AB + 2 = AB2
                    }
                }

                CATALOGO[guia] = {
                    muelle: muelleFinal,
                    ruta: idCompleto,
                    orden: p["Orden"]
                };
            }
        });
        alert("Catálogo cargado: " + Object.keys(CATALOGO).length + " guías listas.");
    }

    document.getElementById('fileViajes').addEventListener('change', procesarArchivos);
    document.getElementById('fileMuelle').addEventListener('change', procesarArchivos);

    // --- ESCÁNER ---
    function onScanSuccess(decodedText) {
        const item = CATALOGO[decodedText];
        const infoDiv = document.getElementById('scannedInfo');
        
        if(item) {
            infoDiv.innerText = `GUÍA: ${decodedText} -> MUELLE: ${item.muelle}`;
            enviarASheets(decodedText, item);
        } else {
            infoDiv.innerText = `ERROR: Guía ${decodedText} no en catálogo`;
            infoDiv.style.color = "red";
        }
    }

    async function enviarASheets(guia, item) {
        const table = document.getElementById('logTable').querySelector('tbody');
        const row = table.insertRow(0);
        row.innerHTML = `<td>${guia}</td><td>${item.muelle}</td><td>${item.orden}</td><td class="status-sync">...</td>`;

        try {
            await fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                body: JSON.stringify({guia: guia, muelle: item.muelle, ruta: item.ruta, orden: item.orden})
            });
            row.cells[3].innerText = "✅";
            row.cells[3].className = "status-ok";
        } catch(e) {
            row.cells[3].innerText = "❌";
        }
    }

    let scanner = new Html5QrcodeScanner("reader", { fps: 15, qrbox: 250 });
    scanner.render(onScanSuccess);
</script>
</body>
</html>
